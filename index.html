<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drake Catalog Explorer - iTunes API Demo</title>

    <!-- Linking Style Sheet -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Linking Script -->
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <h1>Drake Catalog Explorer</h1>
        <p class="subtitle">A live demo of the iTunes Search API - Assignment 3: Third Party APIs</p>
    </header>

    <!-- Main -->
    <main>

        <!-- Artist profile card (filled in with js) -->
        <section id="artist-section" class="artist-card">
            <p class="loading-msg">Loading artist data from iTunes...</p>
        </section>

        <!-- Top Tracks (filled in with js) -->
        <section class="content-section">
            <h2>Top Tracks</h2>
            <div id="top-tracks-container" class="tracks-grid">
                <p class="loading-msg">Loading top tracks...</p>
            </div>
        </section>

        <!-- Album section (filled in with js) -->
        <section class="content-section">
            <h2>Albums & Discography</h2>
            <div id="albums-container" class="albums-grid">
                <p class="loading-msg">Loading albums...</p> 
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>
            Built using the
            <a href="https://performance-partners.apple.com/search-api" target="_blank" rel="noopener noreferrer">
                iTunes Search API
            </a>.
        </p>

        <!-- Adding student info -->
        <p id="student-info"></p>
    </footer>

</body>
</html>
