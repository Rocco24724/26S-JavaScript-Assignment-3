<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width", initial-scale="1.0" />
    <title>Drake Catalog Explorer - Spotify Web API Demo </title>

    <!-- Linking Style Sheet -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Linking Script -->
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <h1> Drake Catalog Explorer</h1>
        <p class="subtitle">A live demo of the Spotify Web API - Assignment 3: Third Party APIs</p>
    </header>

    <!-- Main -->
    <main>

        <!-- With all the sections in my main I have a loading message that shows up before the js pulls from the API for the info I need-->
        <!-- Artist profile card (filled in with js) -->
        <section id ="artist-section" class="artist-card">
            <p class="loading-msg">Loading artist data from Spotify</p>
        </section>

        <!-- Top Tracks (filled in with js) -->
        <section class="content-section">
            <h2>Top Tracks</h2>
            <div id="top-tracks-container" class="tracks-grid">
                <p class="loading-msg">Loading top tracks</p>
            </div>
        </section>

        <!-- Album section (filled in with js) -->
        <section class="content-section">
            <h2>Albums & Discography </h2>
            <div id="albums-container" class="albums-grid">
                <p class="loading-msg">Loading albums</p> 
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p>
            Built using the
            <a href="https://developer.spotify.com/documentation/web-api" target="_blank" rel="noopener noreferrer">
                Spotify Web API
            </a>.
        </p>

        <!-- Adding my info in -->
        <p id="student-info"></p>
    </footer>

</body>
</html>
